# Workflow: testes automatizados e lint com Ruff após push/PR em main ou master.
name: Workflow — testes e Ruff

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Ruff e pytest
    runs-on: ubuntu-latest
    env:
      THEMESCOPE_LLM_PROVIDER: ollama
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Verificar estilo e imports (Ruff)
        run: ruff check src api tests

      - name: Executar testes (pytest)
        run: pytest -q
