# Workflow: análise estática com Pylint em todas as versões suportadas do Python.
name: Workflow — Pylint

on: [push]

jobs:
  pylint:
    name: Pylint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências do projeto e Pylint
        run: |
          python -m pip install --upgrade pip
          pip install pylint -r requirements.txt

      - name: Executar Pylint nos arquivos versionados
        run: pylint $(git ls-files '*.py')
