[project]
name = "themescope"
version = "1.0.0"
description = "Avaliação de alinhamento temático em redações (embeddings, LLM, híbrido)"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "api", "tests", "scripts", "dados_sinteticos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Pylint: docstrings e limites de assinatura são flexibilizados aqui; estilo principal fica no Ruff.
# O CI instala requirements antes do Pylint para evitar import-error em fastapi, numpy, etc.
[tool.pylint.main]
py-version = "3.10"
jobs = 0

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "duplicate-code",
    "broad-exception-caught",
    "import-outside-toplevel",
    "global-statement",
    "invalid-name",
    "redefined-outer-name",
    "wrong-import-order",
    "wrong-import-position",
    "consider-using-from-import",
    "useless-import-alias",
    "use-dict-literal",
    "f-string-without-interpolation",
    "unused-argument",
    "fixme",
]

[tool.pylint.design]
max-args = 12
max-positional-arguments = 12
max-locals = 20
